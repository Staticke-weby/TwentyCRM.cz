# Build webu (Astro + Pagefind) a nasazení na GitHub Pages při každém pushi do main.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Dočasně na https://staticke-weby.github.io/TwentyCRM.cz/ — noindex (žádný duplikát ve vyhledávání)
      # a cesty předsazené podsložkou. Po přepnutí na doménu www.twentycrm.cz smazat NOINDEX a krok „docasna-adresa".
      - run: npm run build
        env:
          NOINDEX: '1'
      - run: node scripts/docasna-adresa.mjs /TwentyCRM.cz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
