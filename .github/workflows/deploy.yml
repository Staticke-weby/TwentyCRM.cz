# Build webu (Astro + Pagefind) a nasazení na GitHub Pages při každém pushi do main.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ostrý web na https://www.twentycrm.cz/ (vlastní doména v nastavení Pages, od 2026-11-13).
      # Pro náhled v podsložce github.io by šlo: npm run build:staging + node scripts/docasna-adresa.mjs /TwentyCRM.cz
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
